name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SHUKI_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Show key alias and fingerprint (no secrets are printed)
        env:
          SHUKI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore "$SHUKI_KEYSTORE_PATH" -storepass "$SHUKI_KEYSTORE_PASSWORD" \
            | grep -E "Alias name|SHA1:|SHA256:|Valid from" || echo "::warning::Could not read keystore. Check KEYSTORE_PASSWORD."

      - name: Build signed APK and AAB
        working-directory: android
        env:
          SHUKI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SHUKI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SHUKI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: shuki-apk
          path: android/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shuki-aab
          path: android/app/build/outputs/bundle/release/*.aab
